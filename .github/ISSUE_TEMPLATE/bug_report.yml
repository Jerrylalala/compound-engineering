name: Bug report
description: Report something that is broken or misleading.
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for someone else to reproduce it.
  - type: input
    id: version
    attributes:
      label: Version
      description: Package, plugin, or commit version.
      placeholder: "2.63.1 or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Claude Code plugin
        - Codex conversion
        - Gemini conversion
        - OpenCode conversion
        - CLI install or plugin-path
        - Documentation
        - Release metadata
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List exact commands or UI steps.
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        Shell:
        Bun:
        Claude Code / Codex / Gemini:
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell

