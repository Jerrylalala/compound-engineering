name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test --timeout 60000

      - name: Validate release metadata
        run: bun run release:validate

      - name: Check feature integrity
        run: bash scripts/check-feature-integrity.sh

      - name: Package smoke
        shell: bash
        run: |
          pack_dir="$(mktemp -d)"
          install_dir="$(mktemp -d)"
          trap 'rm -rf "$pack_dir" "$install_dir"' EXIT

          npm pack --pack-destination "$pack_dir"
          tgz="$(find "$pack_dir" -name '*.tgz' -print -quit)"
          test -n "$tgz"

          cd "$install_dir"
          npm init -y >/dev/null
          npm install "$tgz" >/dev/null
          npx compound-plugin --help

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      - name: Build docs strictly
        run: mkdocs build --strict
